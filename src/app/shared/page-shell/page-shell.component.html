<div class="shell">
  <div class="shell-inner">
    <aside class="sidebar" aria-label="Site navigation">
      <a class="logo" routerLink="/" routerLinkActive="is-active" aria-label="Home">
        <svg width="200" height="42" viewBox="0 0 200 42" aria-hidden="true" style="display: block; overflow: visible; margin-top: 10px;">
          <defs>
            <clipPath id="glitch-cut">
              <rect x="0" y="0" width="200" height="20" />
            </clipPath>
          </defs>
          <!-- Cyan offset (Glitch) -->
          <text x="3" y="32" font-family="var(--font-logo)" font-weight="900" font-size="32" fill="var(--accent-cyan)" opacity="0.8" style="letter-spacing: 2px;">PHUC LE</text>
          <!-- Magenta Main -->
          <text x="0" y="32" font-family="var(--font-logo)" font-weight="900" font-size="32" fill="var(--neon-magenta)" style="letter-spacing: 2px;">PHUC LE</text>
          <!-- Top half slice offset -->
          <text x="-2" y="32" font-family="var(--font-logo)" font-weight="900" font-size="32" fill="var(--text-white)" clip-path="url(#glitch-cut)" style="letter-spacing: 2px;">PHUC LE</text>
        </svg>
      </a>

      <nav class="nav">
        <a
          class="nav-item"
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          blog
        </a>
        <a class="nav-item" routerLink="/about" routerLinkActive="is-active">about</a>
        <a class="nav-item" routerLink="/project" routerLinkActive="is-active">project</a>
        <a class="nav-item" routerLink="/contact" routerLinkActive="is-active">contact</a>
      </nav>
      
    </aside>

    <section class="main" aria-label="Content">
      <div class="main-frame">
        <button class="corner corner--top" type="button" (click)="goBack()">
          BACK
        </button>

        <main class="content">
          <ng-content></ng-content>
        </main>

        <footer class="footer" aria-label="Site footer">
          © 2026 @phuc4real
        </footer>

        <button class="corner corner--bottom" type="button" (click)="scrollToTop()" aria-label="Scroll to top">
          ▲<br />TOP
        </button>
      </div>
    </section>

    <div class="right-void" aria-hidden="true"></div>
  </div>
</div>
